<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Block Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            max-width: 70vw;
            max-height: 70vh;
            background-color: #000000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        .ui-layer {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
        .diamond-icon {
            width: 10px;
            height: 10px;
            background-color: #aaaaaa;
            transform: rotate(45deg);
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-layer">
            <div class="diamond-icon"></div>
            <span id="gemCount">0</span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountEl = document.getElementById('gemCount');

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playStoneSound(isBreak = false) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isBreak ? 'triangle' : 'square';
                
                const freq = isBreak ? 120 + Math.random() * 80 : 250 + Math.random() * 100;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        const size = 500;
        canvas.width = size;
        canvas.height = size;

        const cols = 30;
        const rows = 30;
        const blockSize = size / cols;

        let gems = 0;
        let blocks = [];
        let particles = [];
        let floatingTexts = [];

        // 공 설정: 크기 줄임, 속도 2배 정도로 조정, 벽 사이(왼쪽)에서 스폰하여 뒤로 살짝 나옴
        let ball = {
            x: blockSize * 1.5,
            y: size * 0.5,
            radius: blockSize * 0.25,
            dx: blockSize * 0.15,
            dy: blockSize * 0.12,
            damage: 1
        };

        // 블록 설정: 오른쪽 반을 채우도록 변경
        const rightColsStart = Math.floor(cols / 2);
        for (let r = 0; r < rows; r++) {
            for (let c = rightColsStart; c < cols; c++) {
                blocks.push({
                    x: c * blockSize,
                    y: r * blockSize,
                    hp: 1,
                    maxHp: 1
                });
            }
        }

        function checkAndRefillBlocks() {
            for (let r = 0; r < rows; r++) {
                let rowBlocks = blocks.filter(b => Math.abs(b.y - r * blockSize) < 1);
                if (rowBlocks.length === 0) {
                    blocks.forEach(b => {
                        if (b.y < r * blockSize) {
                            b.y += blockSize;
                        }
                    });
                    for (let c = rightColsStart; c < cols; c++) {
                        blocks.push({
                            x: c * blockSize,
                            y: 0,
                            hp: 1,
                            maxHp: 1
                        });
                    }
                }
            }
        }

        function createParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: blockSize * 0.2,
                    alpha: 1,
                    decay: 0.04
                });
            }
        }

        function createFloatingText(x, y) {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
            const speed = 1.5 + Math.random();
            floatingTexts.push({
                x: x,
                y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                alpha: 1,
                text: '+1'
            });
        }

        function update() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.dx = -ball.dx;
            }
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.dy = -ball.dy;
            }
            if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.dy = -ball.dy;
            }

            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                
                const closestX = Math.max(b.x, Math.min(ball.x, b.x + blockSize));
                const closestY = Math.max(b.y, Math.min(ball.y, b.y + blockSize));

                const distX = ball.x - closestX;
                const distY = ball.y - closestY;
                const distance = Math.hypot(distX, distY);

                if (distance < ball.radius) {
                    b.hp -= ball.damage;
                    playStoneSound(b.hp <= 0);

                    if (b.hp <= 0) {
                        createParticles(b.x + blockSize / 2, b.y + blockSize / 2);
                        createFloatingText(b.x + blockSize / 2, b.y + blockSize / 2);
                        
                        gems += 1;
                        gemCountEl.textContent = gems;

                        blocks.splice(i, 1);
                        checkAndRefillBlocks();
                    } else {
                        playStoneSound(false);
                    }

                    if (Math.abs(distX) > Math.abs(distY)) {
                        ball.dx = -ball.dx;
                    } else {
                        ball.dy = -ball.dy;
                    }
                    break;
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.x += ft.dx;
                ft.y += ft.dy;
                ft.alpha -= 0.025;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#888888';
            for (let i = 0; i < blocks.length; i++) {
                ctx.fillRect(blocks[i].x, blocks[i].y, blockSize - 1, blockSize - 1);
            }

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.fillStyle = `rgba(136, 136, 136, ${p.alpha})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.closePath();

            for (let i = 0; i < floatingTexts.length; i++) {
                let ft = floatingTexts[i];
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = `rgba(255, 255, 255, ${ft.alpha})`;
                ctx.fillText(ft.text, ft.x, ft.y);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('pointerdown', () => {
            initAudio();
        }, { once: true });

        loop();
    </script>
</body>
</html>
