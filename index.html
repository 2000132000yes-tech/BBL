<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Block Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            max-width: 70vw;
            max-height: 70vh;
            background-color: #000000;
            border: 2px solid #555555;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        .ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .currency-box {
            display: flex;
            align-items: center;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            pointer-events: auto;
        }
        .diamond-icon {
            width: 10px;
            height: 10px;
            background-color: #aaaaaa;
            transform: rotate(45deg);
            margin-right: 8px;
        }
        .top-right-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }
        .top-btn {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #555;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .top-btn:active {
            background: #555;
        }

        /* 슬라이드 업그레이드 창 */
        .upgrade-panel {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 50%;
            background: rgba(15, 15, 15, 0.98);
            border-bottom: 2px solid #444;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            transition: top 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 20;
            box-sizing: border-box;
            padding: 15px;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .upgrade-panel.active {
            top: 0;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .panel-title {
            font-size: 16px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
        }
        .upgrade-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .upgrade-card {
            background: #222;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
        }
        .card-stats {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }
        .upgrade-btn {
            background: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .upgrade-btn.affordable {
            background: #00bcd4;
            color: #000;
        }
        .upgrade-btn.disabled {
            background: #444 !important;
            color: #888 !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-layer">
            <div class="currency-box">
                <div class="diamond-icon"></div>
                <span id="gemCount">0</span>
            </div>
            <div class="top-right-group">
                <button class="top-btn" id="openUpgradeBtn">+</button>
            </div>
        </div>

        <div class="upgrade-panel" id="upgradePanel">
            <div class="panel-header">
                <div class="panel-title">UPGRADES</div>
                <button class="close-btn" id="closeUpgradeBtn">✕</button>
            </div>
            <div class="upgrade-list" id="upgradeListContent">
                <!-- 동적으로 채워짐 -->
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountEl = document.getElementById('gemCount');
        const upgradePanel = document.getElementById('upgradePanel');
        const openUpgradeBtn = document.getElementById('openUpgradeBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');
        const upgradeListContent = document.getElementById('upgradeListContent');

        let gems = 0;

        openUpgradeBtn.addEventListener('click', () => upgradePanel.classList.add('active'));
        closeUpgradeBtn.addEventListener('click', () => upgradePanel.classList.remove('active'));

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playStoneSound(isBreak = false) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isBreak ? 'triangle' : 'square';
                const freq = isBreak ? 120 + Math.random() * 80 : 250 + Math.random() * 100;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        const size = 500;
        canvas.width = size;
        canvas.height = size;

        const cols = 30;
        const rows = 30;
        const blockSize = size / cols;

        let blocks = [];
        let particles = [];
        let floatingTexts = [];

        // 공 구매 및 가격 설정 (5원 시작, 5원씩 증가)
        let ballUpgrade = {
            count: 1,
            cost: 5,
            costInc: 5
        };

        let balls = [];

        function initBalls() {
            balls = [];
            for(let i = 0; i < ballUpgrade.count; i++) {
                balls.push({
                    x: blockSize * 1.5,
                    y: size * (0.4 + (i % 5) * 0.05),
                    radius: blockSize * 0.25,
                    dx: blockSize * 0.3,
                    dy: blockSize * 0.24,
                    damage: 1
                });
            }
        }

        const rightColsStart = Math.floor(cols / 2);

        function spawnBlocks() {
            blocks = [];
            for (let r = 0; r < rows; r++) {
                for (let c = rightColsStart; c < cols; c++) {
                    blocks.push({
                        x: c * blockSize,
                        y: r * blockSize,
                        hp: 1,
                        maxHp: 1
                    });
                }
            }
        }

        spawnBlocks();
        initBalls();

        function checkAndRefillBlocks() {
            for (let r = 0; r < rows; r++) {
                let rowBlocks = blocks.filter(b => Math.abs(b.y - r * blockSize) < 1);
                if (rowBlocks.length === 0) {
                    blocks.forEach(b => {
                        if (b.y < r * blockSize) {
                            b.y += blockSize;
                        }
                    });
                    for (let c = rightColsStart; c < cols; c++) {
                        blocks.push({
                            x: c * blockSize,
                            y: 0,
                            hp: 1,
                            maxHp: 1
                        });
                    }
                }
            }
        }

        function createParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x, y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: blockSize * 0.2,
                    alpha: 1,
                    decay: 0.04
                });
            }
        }

        function createFloatingText(x, y) {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
            const speed = 1.5 + Math.random();
            floatingTexts.push({
                x: x, y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                alpha: 1,
                text: '+1'
            });
        }

        function updateUpgradeUI() {
            let html = `
            <div class="upgrade-card">
                <div>
                    <div class="card-title">공 추가 (+1 Ball)</div>
                    <div class="card-stats">현재 보유: ${ballUpgrade.count}개</div>
                </div>
                <button class="upgrade-btn ${gems >= ballUpgrade.cost ? 'affordable' : 'disabled'}" onclick="buyBall()">
                    <div class="diamond-icon" style="width:8px;height:8px;"></div>구매 (${ballUpgrade.cost})
                </button>
            </div>`;
            upgradeListContent.innerHTML = html;
        }

        window.buyBall = function() {
            if (gems >= ballUpgrade.cost) {
                gems -= ballUpgrade.cost;
                ballUpgrade.cost += ballUpgrade.costInc;
                ballUpgrade.count++;
                gemCountEl.textContent = gems;
                initBalls();
                updateUpgradeUI();
            }
        };

        updateUpgradeUI();

        function update() {
            for (let b of balls) {
                // 기존 속도보다 2배 더 빠르게 설정 (원래 배속의 2배 적용)
                b.x += b.dx * 2.0;
                b.y += b.dy * 2.0;

                if (b.x - b.radius < 0) { b.x = b.radius; b.dx = -b.dx; }
                if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.dx = -b.dx; }
                if (b.y - b.radius < 0) { b.y = b.radius; b.dy = -b.dy; }
                if (b.y + b.radius > canvas.height) { b.y = canvas.height - b.radius; b.dy = -b.dy; }

                for (let i = blocks.length - 1; i >= 0; i--) {
                    const bl = blocks[i];
                    const closestX = Math.max(bl.x, Math.min(b.x, bl.x + blockSize));
                    const closestY = Math.max(bl.y, Math.min(b.y, bl.y + blockSize));

                    const distX = b.x - closestX;
                    const distY = b.y - closestY;
                    const distance = Math.hypot(distX, distY);

                    if (distance < b.radius) {
                        bl.hp -= b.damage;
                        playStoneSound(bl.hp <= 0);

                        if (bl.hp <= 0) {
                            createParticles(bl.x + blockSize / 2, bl.y + blockSize / 2);
                            createFloatingText(bl.x + blockSize / 2, bl.y + blockSize / 2);
                            
                            gems += 1;
                            gemCountEl.textContent = gems;
                            updateUpgradeUI();

                            blocks.splice(i, 1);
                            checkAndRefillBlocks();
                        } else {
                            playStoneSound(false);
                        }

                        if (Math.abs(distX) > Math.abs(distY)) {
                            b.dx = -b.dx;
                        } else {
                            b.dy = -b.dy;
                        }
                        break;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.x += ft.dx; ft.y += ft.dy;
                ft.alpha -= 0.025;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#888888';
            for (let i = 0; i < blocks.length; i++) {
                ctx.fillRect(blocks[i].x, blocks[i].y, blockSize - 1, blockSize - 1);
            }

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.fillStyle = `rgba(136, 136, 136, ${p.alpha})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            for (let b of balls) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.closePath();
            }

            for (let i = 0; i < floatingTexts.length; i++) {
                let ft = floatingTexts[i];
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = `rgba(255, 255, 255, ${ft.alpha})`;
                ctx.fillText(ft.text, ft.x, ft.y);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('pointerdown', () => initAudio(), { once: true });
        loop();
    </script>
</body>
</html>
