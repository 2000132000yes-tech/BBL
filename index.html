<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 1. 공 설정 (시작 위치: 화면 정가운데, 크기 대폭 축소, 속도 빠르게)
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 1.5, // 크기 줄임
            color: '#ffffff', // 하얀색 공
            dx: 9,  // 속도 빠르게
            dy: -7, // 속도 빠르게
            history: [],
            maxHistory: 10,
            active: true
        };

        // 2. 블록 설정 (화면 오른쪽 반을 채우고, 회색, 크기는 공과 비슷하거나 한 칸 크기)
        const pixelSize = 6;
        const blocks = [];
        const cols = Math.floor(canvas.width / pixelSize);
        const rows = Math.floor(canvas.height / pixelSize);

        const startCol = Math.floor(cols / 2); // 오른쪽 반 시작 지점

        for (let r = 0; r < rows; r++) {
            for (let c = startCol; c < cols; c++) {
                blocks.push({
                    x: c * pixelSize,
                    y: r * pixelSize,
                    hp: 1, // 체력 1
                    color: '#888888' // 회색 블록
                });
            }
        }

        // 파티클 (타격/이펙트)
        const particles = [];
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: 1,
                    decay: 0.05
                });
            }
        }

        // 떠오르는 +1 텍스트
        const floatingTexts = [];
        function createFloatingText(x, y) {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
            const speed = 1.5;
            floatingTexts.push({
                x: x,
                y: y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                alpha: 1
            });
        }

        let score = 0;

        function update() {
            if (ball.active) {
                // 잔상 기록
                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > ball.maxHistory) {
                    ball.history.shift();
                }

                // 공 이동
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 벽 충돌 (왼쪽/위/아래 벽에 닿으면 튕김)
                if (ball.x - ball.radius <= 0) {
                    ball.x = ball.radius;
                    ball.dx = -ball.dx;
                }
                if (ball.y - ball.radius <= 0) {
                    ball.y = ball.radius;
                    ball.dy = -ball.dy;
                }
                if (ball.y + ball.radius >= canvas.height) {
                    ball.y = canvas.height - ball.radius;
                    ball.dy = -ball.dy;
                }
                // 오른쪽 끝 벽에 닿으면 리셋 또는 반사 (여기서는 반사 처리)
                if (ball.x + ball.radius >= canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.dx = -ball.dx;
                }

                // 블록 충돌 체크 (안쪽도 부술 수 있도록)
                for (let i = blocks.length - 1; i >= 0; i--) {
                    const b = blocks[i];
                    if (
                        ball.x + ball.radius >= b.x &&
                        ball.x - ball.radius <= b.x + pixelSize &&
                        ball.y + ball.radius >= b.y &&
                        ball.y - ball.radius <= b.y + pixelSize
                    ) {
                        // 데미지 1 부여 및 파괴
                        createParticles(b.x + pixelSize / 2, b.y + pixelSize / 2);
                        createFloatingText(b.x + pixelSize / 2, b.y + pixelSize / 2);
                        
                        score += 1;
                        blocks.splice(i, 1);

                        // 간단한 반사 처리
                        ball.dx = -ball.dx;
                        break;
                    }
                }

                // 한 줄이 없어지면 내려오면서 채우기 로직
                for (let r = 0; r < rows; r++) {
                    const rowBlocks = blocks.filter(b => Math.abs(b.y - r * pixelSize) < 1);
                    if (rowBlocks.length === 0) {
                        // 해당 줄 위쪽 블록들을 아래로 한 칸씩 내림
                        blocks.forEach(b => {
                            if (b.y < r * pixelSize) {
                                b.y += pixelSize;
                            }
                        });
                        // 맨 위쪽(r=0)에 새로운 줄 채우기
                        for (let c = startCol; c < cols; c++) {
                            blocks.push({
                                x: c * pixelSize,
                                y: 0,
                                hp: 1,
                                color: '#888888'
                            });
                        }
                    }
                }
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 플로팅 텍스트 업데이트
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.x += ft.dx;
                ft.y += ft.dy;
                ft.alpha -= 0.03;
                if (ft.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
        }

        function draw() {
            // 배경 검은색
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 오른쪽 반에 위치한 회색 블록 그리기
            for (let i = 0; i < blocks.length; i++) {
                ctx.fillStyle = blocks[i].color;
                ctx.fillRect(blocks[i].x, blocks[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 공 잔상 및 하얀색 공 그리기
            if (ball.active) {
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }

            // 파티클 이펙트
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
                ctx.closePath();
            }

            // 위쪽 오른쪽 구석 회색 마름모 및 숫자 UI
            ctx.save();
            ctx.translate(canvas.width - 60, 30);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#888888';
            ctx.fillRect(-6, -6, 12, 12);
            ctx.restore();

            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'right';
            ctx.fillText(score, canvas.width - 25, 36);

            // 블록 파괴 시 올라가는 +1 텍스트 (위쪽으로 무작위 방향, 흐려짐)
            for (let i = 0; i < floatingTexts.length; i++) {
                const ft = floatingTexts[i];
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = `rgba(255, 255, 255, ${ft.alpha})`;
                ctx.textAlign = 'center';
                ctx.fillText('+1', ft.x, ft.y);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
